<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Bus Dashboard</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=138">
</head>
<body>
    <header class="app-header">
        <h1 class="main-title" id="main-title">THE WHEELS ON THE BUS GO.... 'TAKE ME HOME!'</h1>
        <div class="clock-container">
            <div id="clock" class="clock"></div>
            <div id="sync-status" class="sync-status">DATA LAST SYNCED: --:--:--</div>
        </div>
    </header>
    <main class="app-main">
        <div id="map"></div>
        <div id="arrivals-board" class="arrivals-board">
            <!-- Active stop arrivals will be rendered here -->
        </div>
        <div id="qr-container" class="qr-container">
            <div id="qrcode"></div>
            <p>SCAN TO GET THIS INFO ON YOUR OWN MOBILE PHONE</p>
        </div>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="app.js?v=131"></script>
</body>
</html>
